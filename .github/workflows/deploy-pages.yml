name: Deploy V1 + V2 (GitHub Pages)

# Publie les deux versions du site dans un seul artefact Pages :
#   V1 (branche main)      -> https://icosium-expo.github.io/icosium-display/
#   V2 (branche v2-design) -> https://icosium-expo.github.io/icosium-display/v2/

on:
  push:
    branches: [main, v2-design]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1 (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: v1

      - name: Checkout V2 (v2-design)
        uses: actions/checkout@v4
        with:
          ref: v2-design
          path: v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            v1/package-lock.json
            v2/package-lock.json

      - name: Build V1
        working-directory: v1
        env:
          VITE_BASE: /icosium-display/
        run: |
          npm ci
          npm run build

      - name: Build V2
        working-directory: v2
        env:
          VITE_BASE: /icosium-display/v2/
        run: |
          npm ci
          npm run build

      - name: Assemble le site (V1 à la racine, V2 dans /v2)
        run: |
          mkdir site
          cp -r v1/dist/. site/
          mkdir site/v2
          cp -r v2/dist/. site/v2/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
